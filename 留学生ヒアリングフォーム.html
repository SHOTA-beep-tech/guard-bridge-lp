<meta charset="UTF-8">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --paper: #f2f3f2;
    --paper-deep: #e8eae8;
    --ink: #14202e;
    --ink-soft: #313d49;
    --muted: #6e7680;
    --line: #d6dbd8;
    --navy: #1f4e79;
    --navy-deep: #163a5c;
    --line-green: #06c755;
    --line-green-deep: #05a648;
    --white: #ffffff;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Sans", "Noto Sans JP", "Noto Sans SC", "Noto Sans Devanagari", "Noto Sans Myanmar", "Noto Sans Bengali", sans-serif;
    background: var(--paper);
    color: var(--ink-soft);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  #app {
    width: 100%;
    max-width: 480px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 24px;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ---- Language select screen ---- */
  .lang-globe { font-size: 40px; text-align: center; margin-bottom: 12px; }
  .lang-prompt { text-align: center; color: var(--ink); font-weight: 700; font-size: 18px; margin-bottom: 4px; }
  .lang-prompt-sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .lang-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .lang-btn {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 500;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, background .15s;
  }
  .lang-btn:hover { border-color: var(--navy); background: var(--white); }

  /* ---- Form screen ---- */
  .form-title { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .form-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .field { margin-bottom: 22px; }
  .field label.field-label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .field .required-mark {
    color: var(--line-green-deep);
    font-size: 11px;
    font-weight: 700;
    margin-left: 6px;
    border: 1px solid var(--line-green);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .field .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.6;
  }
  input[type="text"], input[type="tel"], select, textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--navy);
  }
  textarea { resize: vertical; min-height: 80px; }

  .radio-group { display: flex; flex-direction: column; gap: 8px; }
  .radio-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    cursor: pointer;
  }
  .radio-option input { width: 16px; height: 16px; flex-shrink: 0; }
  .radio-option span { font-size: 14px; color: var(--ink-soft); }
  .radio-option:has(input:checked) { border-color: var(--navy); background: var(--white); }

  .hidden { display: none !important; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
    background: var(--line-green);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
  }
  .submit-btn:hover { background: var(--line-green-deep); }
  .submit-btn:disabled { background: var(--muted); cursor: not-allowed; }

  .back-link {
    display: block;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 16px;
    cursor: pointer;
    text-decoration: underline;
  }

  /* ---- Thanks screen ---- */
  .thanks-icon { font-size: 40px; text-align: center; margin-bottom: 16px; }
  .thanks-title { font-size: 18px; font-weight: 700; color: var(--ink); text-align: center; margin-bottom: 8px; }
  .thanks-body { font-size: 14px; color: var(--ink-soft); text-align: center; line-height: 1.8; }
</style>
</head>

<div id="app">

    <!-- Screen 1: language select -->

      <form id="hearing-form"></form>
      <span class="back-link" id="back-link"></span>
    </div>

    <!-- Screen 3: thanks -->

      <div class="thanks-title" id="thanks-title"></div>
      <div class="thanks-body" id="thanks-body"></div>
    </div>

</div>

let currentLang = "ja";

const screenLang = document.getElementById("screen-lang");
const screenForm = document.getElementById("screen-form");
const screenThanks = document.getElementById("screen-thanks");
const langGrid = document.getElementById("lang-grid");
const hearingForm = document.getElementById("hearing-form");

function showScreen(el) {
  [screenLang, screenForm, screenThanks].forEach(s => s.classList.remove("active"));
  el.classList.add("active");
}

// build language buttons
LANG_LABELS.forEach(l => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "lang-btn";
  btn.textContent = l.native;
  btn.addEventListener("click", () => {
    currentLang = l.code;
    renderForm();
    showScreen(screenForm);
  });
  langGrid.appendChild(btn);
});

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  });
  children.forEach(c => node.appendChild(c));
  return node;
}

function buildTextField(id, def, required) {
  const wrap = el("div", { class: "field" });
  const label = el("label", { class: "field-label", for: id, text: def.label });
  if (required) label.appendChild(el("span", { class: "required-mark", text: T[currentLang].required }));
  wrap.appendChild(label);
  wrap.appendChild(el("input", { type: id === "phone" ? "tel" : "text", id, name: id, placeholder: def.placeholder || "", ...(required ? { required: "required" } : {}) }));
  return wrap;
}

function buildTextareaField(id, def, required) {
  const wrap = el("div", { class: "field" });
  const label = el("label", { class: "field-label", for: id, text: def.label });
  if (required) label.appendChild(el("span", { class: "required-mark", text: T[currentLang].required }));
  wrap.appendChild(label);
  const ta = el("textarea", { id, name: id, placeholder: def.placeholder || "" });
  if (required) ta.setAttribute("required", "required");
  wrap.appendChild(ta);
  return wrap;
}

function buildSelectField(id, def, required) {
  const wrap = el("div", { class: "field" });
  const label = el("label", { class: "field-label", for: id, text: def.label });
  if (required) label.appendChild(el("span", { class: "required-mark", text: T[currentLang].required }));
  wrap.appendChild(label);
  const select = el("select", { id, name: id, ...(required ? { required: "required" } : {}) });
  select.appendChild(el("option", { value: "", text: "" }));
  def.options.forEach(opt => select.appendChild(el("option", { value: opt, text: opt })));
  wrap.appendChild(select);
  return wrap;
}

function buildRadioWithOther(name, def, options) {
  const otherValue = options[options.length - 1];
  const radioWrap = buildRadioField(name, def, true, options.map(o => [o, o]));
  radioWrap.id = `${name}-wrap`;

  const otherWrap = buildTextField(`${name}Other`, { label: def.otherLabel, placeholder: def.otherPlaceholder }, false);
  otherWrap.id = `${name}Other-wrap`;
  otherWrap.classList.add("hidden");

  function refreshOtherVisibility() {
    const checked = radioWrap.querySelector(`input[name="${name}"]:checked`);
    const isOther = !!checked && checked.value === otherValue;
    otherWrap.classList.toggle("hidden", !isOther);
    otherWrap.querySelector("input").required = isOther;
  }
  radioWrap.querySelectorAll(`input[name="${name}"]`).forEach(r => r.addEventListener("change", refreshOtherVisibility));
  refreshOtherVisibility();

  return { radioWrap, otherWrap };
}

function buildRadioField(id, def, required, optionPairs) {
  const wrap = el("div", { class: "field" });
  const label = el("label", { class: "field-label", text: def.label });
  if (required) label.appendChild(el("span", { class: "required-mark", text: T[currentLang].required }));
  wrap.appendChild(label);
  const group = el("div", { class: "radio-group" });
  optionPairs.forEach(([value, text]) => {
    const optLabel = el("label", { class: "radio-option" });
    const input = el("input", { type: "radio", name: id, value });
    if (required) input.setAttribute("required", "required");
    optLabel.appendChild(input);
    optLabel.appendChild(el("span", { text }));
    group.appendChild(optLabel);
  });
  wrap.appendChild(group);
  if (def.note) wrap.appendChild(el("div", { class: "note", text: def.note }));
  return wrap;
}

function renderForm() {
  const t = T[currentLang];
  document.getElementById("form-title").textContent = t.formTitle;
  document.getElementById("form-subtitle").textContent = t.formSubtitle;
  document.getElementById("back-link").textContent = t.back;

  hearingForm.innerHTML = "";
  hearingForm.appendChild(buildTextField("name", t.q.name, true));
  hearingForm.appendChild(buildTextField("phone", t.q.phone, true));
  hearingForm.appendChild(buildRadioField("employmentType", t.q.employmentType, true, t.q.employmentType.options));

  const desiredJobWrap = buildRadioField("desiredJob", t.q.desiredJob, true, t.q.desiredJob.fulltime.map(o => [o, o]));
  desiredJobWrap.id = "desiredJob-wrap";
  hearingForm.appendChild(desiredJobWrap);

  const visaStatusFields = buildRadioWithOther("visaStatus", t.q.visaStatus, t.q.visaStatus.options);
  hearingForm.appendChild(visaStatusFields.radioWrap);
  hearingForm.appendChild(visaStatusFields.otherWrap);

  hearingForm.appendChild(buildSelectField("japaneseLevel", t.q.japaneseLevel, true));

  const workableHoursWrap = buildRadioField("workableHours", t.q.workableHours, false, t.q.workableHours.options.map(o => [o, o]));
  workableHoursWrap.id = "workableHours-wrap";
  hearingForm.appendChild(workableHoursWrap);

  hearingForm.appendChild(buildSelectField("startDate", t.q.startDate, true));
  hearingForm.appendChild(buildTextField("area", t.q.area, true));
  hearingForm.appendChild(buildTextareaField("experience", t.q.experience, false));
  hearingForm.appendChild(buildTextareaField("notes", t.q.notes, false));

  const submitBtn = el("button", { type: "submit", class: "submit-btn", text: t.submit });
  hearingForm.appendChild(submitBtn);

  function refreshDesiredJob() {
    const empType = hearingForm.querySelector('input[name="employmentType"]:checked');
    const isPartTime = empType && empType.value === "parttime";
    const jobOptions = isPartTime ? t.q.desiredJob.parttime : t.q.desiredJob.fulltime;

    const { radioWrap, otherWrap } = buildRadioWithOther("desiredJob", t.q.desiredJob, jobOptions);
    document.getElementById("desiredJob-wrap").replaceWith(radioWrap);
    const existingOtherWrap = document.getElementById("desiredJobOther-wrap");
    if (existingOtherWrap) existingOtherWrap.remove();
    radioWrap.after(otherWrap);

    const hoursWrap = document.getElementById("workableHours-wrap");
    hoursWrap.classList.toggle("hidden", !isPartTime);
    hoursWrap.querySelectorAll("input").forEach(i => i.required = isPartTime);
  }

  hearingForm.querySelectorAll('input[name="employmentType"]').forEach(r => {
    r.addEventListener("change", refreshDesiredJob);
  });
  refreshDesiredJob();

  hearingForm.onsubmit = handleSubmit;
}

document.getElementById("back-link").addEventListener("click", () => showScreen(screenLang));

function handleSubmit(ev) {
  ev.preventDefault();
  const submitBtn = hearingForm.querySelector(".submit-btn");
  submitBtn.disabled = true;

  const formData = new FormData(hearingForm);
  const otherText = formData.get("desiredJobOther");
  if (otherText) {
    formData.set("desiredJob", `${formData.get("desiredJob")}: ${otherText}`);
  }
  formData.delete("desiredJobOther");

  const visaOtherText = formData.get("visaStatusOther");
  if (visaOtherText) {
    formData.set("visaStatus", `${formData.get("visaStatus")}: ${visaOtherText}`);
  }
  formData.delete("visaStatusOther");
  formData.append("language", currentLang);

  fetch(GAS_ENDPOINT_URL, {
    method: "POST",
    mode: "no-cors",
    body: formData
  }).then(() => {
    showThanks();
  }).catch(() => {
    // no-cors では失敗を検知できないため、通信自体が発火していれば完了扱いにする
    showThanks();
  }).finally(() => {
    submitBtn.disabled = false;
  });
}

function showThanks() {
  const t = T[currentLang];
  document.getElementById("thanks-title").textContent = t.thanksTitle;
  document.getElementById("thanks-body").textContent = t.thanksBody;
  showScreen(screenThanks);
}
</script>

</body>
</html>
